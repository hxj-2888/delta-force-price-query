# ===== GitHub Actions — Cloudflare Pages 自动部署 =====
# 触发: push 到 main（或手动 workflow_dispatch）
# 效果: 自动部署 Cloudflare Pages 正式版（delta-force-v5）
# 依赖 GitHub Secrets（Settings → Secrets and variables → Actions）:
#   CF_API_TOKEN     Cloudflare API Token（需含 Pages/Workers Scripts/D1/KV 的 Edit 权限）
# 注意: 仓库根 wrangler.toml 的 D1/KV 绑定在 CI 中直接生效。

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===== 质量门禁: 语法检查 + 单元/冒烟测试 + bundle 一致性 =====
  check:
    name: Lint, test & bundle check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint (syntax check all JS)
        run: npm run lint

      - name: Unit & smoke tests
        run: npm test

      - name: Check bundle & version consistency
        run: npm run check

  # ===== Cloudflare Pages 正式版（delta-force-v5, 生产分支 main）=====
  deploy-cloudflare:
    name: Cloudflare Pages (production)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ★ 安装包不进 git 仓库（安全），部署时从 GitHub Release 拉回随 Pages 分发
      #   国内用户走 pages.dev 同源直发下载；Release 仅作 CI 内部中转与备用源
      - name: Pull distributables from GitHub Release
        run: |
          curl -fsSL --retry 3 -o delta-force.apk \
            "https://github.com/${{ github.repository }}/releases/latest/download/delta-force.apk"
          curl -fsSL --retry 3 -o delta-force-portable.zip \
            "https://github.com/${{ github.repository }}/releases/latest/download/delta-force-portable.zip"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy . --project-name=delta-force-v5 --branch=main --commit-hash=${{ github.sha }}

  # ===== Cron Worker（每日价格采集 → D1）=====
  # Pages Functions 不支持 Cron，必须单独部署 workers/cron/，否则 30 天价格曲线永远为空。
  deploy-cron:
    name: Deploy Cron Worker
    needs: deploy-cloudflare
    uses: ./.github/workflows/deploy-cron.yml
    secrets: inherit

  # ===== 部署后冒烟验证: Cloudflare 首页与 API 可达 =====
  smoke-test:
    name: Post-deploy smoke test
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare Pages 首页
        run: curl -fsSL -o /dev/null --max-time 30 "https://delta-force-v5.pages.dev/"

      - name: Cloudflare Pages 元数据 API
        run: curl -fsSL --max-time 30 "https://delta-force-v5.pages.dev/api/metadata" | head -c 200
