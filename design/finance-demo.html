<!DOCTYPE html>
<html lang="zh-CN" data-scheme="cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>落幕查 · 理财行情风 Demo</title>
<!--
  ★ 设计 Demo v3：价格/涨跌幅/今开/30日前 = 真实行情快照（零模拟）。
    拉取：node design/fetch-real.cjs（经已部署代理取 item_price_all → real-prices.json）
    生成：node design/gen-demo-data.cjs（合并 data/metadata.json → demo-data.js，1384 件）
  ★ 上线版字段映射：price→现价 | bl/day_3_bl/day_7_bl/day_30_bl→涨跌幅 | price_start→今开 |
    day_30_price→30日前 | grade→等级 | _category→板块 | 收藏→自选。
  ★ v3 变更：走势图加价格刻度（右侧4档）；移除描线动画（修「线后半段消失」）；
    数据换真实快照（涨幅前二如实显示，如 +1561% 的扑克牌）。
  ★ 设计参考：Robinhood Material 案例（色彩即信息/大数字/动效）、
    中国行情惯例红涨绿跌（右上角可切）、东方财富/同花顺涨跌分布与榜单。
-->
<style>
/* ===== 设计令牌 ===== */
:root{
  --bg:#090c12; --surface:#10141d; --surface-2:#161b27; --surface-3:#1c2230;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#eef1f7; --text-2:#96a0b4; --text-3:#5d6678;
  --up:#f0455c; --up-bg:rgba(240,69,92,.12);
  --down:#1ebf77; --down-bg:rgba(30,191,119,.12);
  --brand:#f0b542; --brand-2:#e59a2a;
  --g1:#7f8a9e; --g2:#45b8a8; --g3:#3d9bff; --g4:#a78bfa; --g5:#f08c4a; --g6:#f0b542;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --shadow:0 12px 32px rgba(0,0,0,.55);
}
[data-scheme="intl"]{ --up:#1ebf77; --up-bg:rgba(30,191,119,.12); --down:#f0455c; --down-bg:rgba(240,69,92,.12); }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:contain}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;overflow-x:hidden;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:.2px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--text-3)}

/* ===== 布局骨架 ===== */
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:76px}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:14px 14px 10px;background:rgba(9,12,18,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar .brand{display:flex;align-items:center;gap:8px;min-width:0}
.topbar .brand img{width:30px;height:30px;object-fit:contain;border-radius:var(--r-s)}
.topbar .brand b{font-size:16px;letter-spacing:1px}
.topbar .brand small{display:block;font-size:9px;color:var(--text-3);letter-spacing:2px}
.topbar .spacer{flex:1}
.icon-btn{
  min-width:34px;height:34px;padding:0 10px;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;gap:4px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);font-size:13px;transition:.15s;white-space:nowrap;
}
.icon-btn:active{transform:scale(.93)}
#schemeBtn .sw{display:inline-flex;gap:3px}
#schemeBtn .sw i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ===== 市场宽度卡（移动端顶部） ===== */
.breadth-card{margin:12px 14px 0;padding:14px 16px;
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:var(--r-l)}
.bc-top{display:flex;align-items:center;gap:8px}
.bc-title{font-size:12px;color:var(--text-2);font-weight:600;letter-spacing:1px}
.bc-status{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--down-bg);color:var(--down);
  display:inline-flex;align-items:center;gap:5px}
.bc-status i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;display:inline-block}
.bc-nums{display:flex;margin:12px 0 10px}
.bc-num{flex:1;text-align:center}
.bc-num .v{font-size:24px;font-weight:800}
.bc-num .k{font-size:10px;color:var(--text-3);margin-top:2px}
.bc-num+.bc-num{border-left:1px solid var(--line)}
.breadth{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-3);gap:2px}
.breadth .b-up{background:linear-gradient(90deg,var(--up),rgba(240,69,92,.6));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.breadth .b-flat{background:var(--text-3);opacity:.3;transition:width .6s}
.breadth .b-down{background:linear-gradient(90deg,rgba(30,191,119,.6),var(--down));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bc-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--text-3)}
.bc-foot b{font-weight:600}

/* ===== 涨幅前二（原版模块回归，理财化样式） ===== */
.topmover{margin:12px 14px 0;background:linear-gradient(135deg,rgba(240,181,66,.10),rgba(240,181,66,.03));
  border:1px solid rgba(240,181,66,.28);border-radius:var(--r-l);overflow:hidden}
.tm-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(240,181,66,.15)}
.tm-head .tt{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:1px;display:flex;align-items:center;gap:5px}
.tm-head .tt .fire{font-size:11px}
.tm-head .tp{font-size:10px;color:var(--text-3)}
.tm-head .more{margin-left:auto;font-size:10.5px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;gap:2px}
.tm-head .more:active{opacity:.6}
.tm-row{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:.15s}
.tm-row:hover{background:rgba(240,181,66,.07)}
.tm-row + .tm-row{border-top:1px solid var(--line)}
.tm-rank{width:18px;height:18px;border-radius:6px;background:rgba(240,181,66,.16);color:var(--brand);
  font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tm-pic{width:34px;height:34px;border-radius:var(--r-s);background:var(--surface-3);overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.tm-pic img{width:100%;height:100%;object-fit:contain}
.tm-name{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-name small{display:block;font-size:9.5px;color:var(--text-3);font-weight:400;margin-top:2px}
.tm-px{font-size:13px;font-weight:700;text-align:right}
.tm-px small{font-size:9.5px;font-weight:400;color:var(--text-3)}
.tm-chg{display:block;font-size:11px;font-weight:700;text-align:right;margin-top:2px}

/* ===== 板块 tabs（换行展示：所有分类一眼全见；可多选） ===== */
.sector-tabs{display:flex;flex-wrap:wrap;gap:8px;padding:14px 14px 10px}
.sector-tab{
  flex-shrink:0;height:32px;padding:0 14px;border-radius:20px;font-size:12px;color:var(--text-2);
  background:var(--surface);border:1px solid var(--line);transition:.18s;white-space:nowrap;
}
.sector-tab.on{color:#1a1408;font-weight:600;background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent}

/* ===== 工具行 ===== */
.mkt-tools{display:flex;align-items:center;gap:8px;padding:0 14px 8px;position:relative}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:2px;gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:11px;color:var(--text-2);transition:.15s}
.seg button.on{background:var(--surface-3);color:var(--text);font-weight:600}
.mkt-tools .count{font-size:11px;color:var(--text-3);margin-left:2px}
.mkt-tools .spacer{flex:1}
.sort-btn{height:30px;padding:0 12px;border-radius:var(--r-s);background:var(--surface);border:1px solid var(--line);
  font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.sort-btn b{font-weight:600;color:var(--text)}
/* 排序下拉：点小方块展开全部规则；实心圆点标记当前项 */
.sort-dd{position:absolute;top:38px;right:14px;z-index:50;min-width:138px;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-m);
  box-shadow:var(--shadow);overflow:hidden;padding:4px;animation:pgIn .15s ease}
.sort-dd button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;
  font-size:12px;color:var(--text-2);border-radius:8px;text-align:left;transition:.12s}
.sort-dd button:hover{background:var(--surface-3)}
.sort-dd button.on{color:var(--brand);font-weight:600}
.sort-dd .sdot{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--text-3);flex-shrink:0;transition:.12s}
.sort-dd button.on .sdot{border-color:var(--brand);background:var(--brand)}

/* ===== 列表行 ===== */
.row-list{padding:0 14px}
.row{
  display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:var(--r-m);
  cursor:pointer;transition:background .15s;border:1px solid transparent;
}
.row:hover{background:var(--surface)}
.row:active{background:var(--surface-2)}
.row .pic{width:44px;height:44px;border-radius:var(--r-s);background:var(--surface-3);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)}
.row .pic img{width:100%;height:100%;object-fit:contain}
.row .pic .ph{font-size:16px;opacity:.4}
.row .info{flex:1;min-width:0}
.row .name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tags{display:flex;gap:5px;margin-top:4px;flex-wrap:nowrap;overflow:hidden}
.tag{font-size:9.5px;padding:1.5px 7px;border-radius:5px;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.tag.sector{color:var(--text-3)}
.tag.sector2{color:var(--text-2)}
.tag.grade{font-weight:600}
.row .spark{width:56px;height:26px;flex-shrink:0}
.row .spark svg{width:100%;height:100%;display:block}
.row .quote{width:92px;flex-shrink:0;text-align:right}
.row .px{font-size:14px;font-weight:700}
.row .px small{font-size:10px;font-weight:400;color:var(--text-3);margin-right:1px}
.chg-pill{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:64px;
  margin-top:4px;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:600}
.chg-pill.up{background:var(--up-bg)} .chg-pill.down{background:var(--down-bg)} .chg-pill.flat{background:var(--surface-3)}
.row .star{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);opacity:.75;font-size:15px;border-radius:var(--r-s)}
.row .star.on{color:var(--brand)}
.row .star:active{transform:scale(.85)}
.list-end{text-align:center;padding:18px 0 8px;font-size:10px;color:var(--text-3);line-height:1.8}
#listSentinel{height:8px}

/* ===== 页面切换 ===== */
.page{display:none}.page.on{display:block;animation:pgIn .28s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;gap:8px;padding:16px 16px 6px}
.page-head b{font-size:17px}
.page-head small{font-size:11px;color:var(--text-3)}

/* ===== 右栏：市场总览仪表盘 + 详情（移动端为浮层） ===== */
.detail-pane{
  position:fixed;inset:0;z-index:80;background:var(--bg);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,.32,1);
  max-width:520px;margin:0 auto;overflow-y:auto;padding-bottom:40px;
}
.detail-pane.open{transform:translateY(0)}
.dp-nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 14px;
  background:rgba(9,12,18,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.dp-nav .back{min-width:34px;height:34px;padding:0 10px;border-radius:var(--r-s);background:var(--surface-2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-2)}
.dp-nav .ttl{flex:1;text-align:center;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* —— 仪表盘 —— */
.dash{padding:18px 18px 8px}
.dash .bc-nums .v{font-size:34px}
.dash-mood{text-align:center;font-size:12px;color:var(--text-2);margin:2px 0 4px}
.dash-mood b{font-weight:700}
.dash-sec{font-size:12px;color:var(--text-2);font-weight:600;letter-spacing:1px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.dash-sec small{font-size:10px;color:var(--text-3);font-weight:400;letter-spacing:0}
.sector-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sec-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 12px;cursor:pointer;transition:.15s}
.sec-tile:hover{background:var(--surface-2)}
.sec-tile .sn{font-size:12.5px;font-weight:600}
.sec-tile .sv{font-size:16px;font-weight:700;margin-top:3px}
.sec-tile .sb{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--surface-3);margin-top:8px}
.sec-tile .sb i{display:block;height:100%}
.sec-tile .sk{display:flex;justify-content:space-between;font-size:9px;color:var(--text-3);margin-top:5px}
.rank-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rank-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.rank-card .rh{font-size:11px;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--text-2);display:flex;justify-content:space-between}
.rank-row{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:.15s}
.rank-row:hover{background:var(--surface-2)}
.rank-row .rk{width:16px;font-size:10px;color:var(--text-3);font-weight:700}
.rank-row .rn{flex:1;min-width:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .rc{font-size:11.5px;font-weight:700}

/* —— 详情 —— */
.dp-hero{padding:18px 18px 4px}
.dp-hero .head{display:flex;gap:14px;align-items:center}
.dp-hero .pic{width:64px;height:64px;border-radius:var(--r-m);background:var(--surface-2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.dp-hero .pic img{width:100%;height:100%;object-fit:contain}
.dp-hero h1{font-size:18px;line-height:1.35}
.dp-hero .tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.dp-price{display:flex;align-items:baseline;gap:12px;margin:16px 0 4px}
.dp-price .big{font-size:38px;font-weight:800;letter-spacing:.5px}
.dp-price .big small{font-size:15px;font-weight:400;color:var(--text-3);margin-right:2px}
.dp-price .chg{font-size:14px;font-weight:700}
.dp-anchors{display:flex;gap:22px;padding:6px 2px 12px;font-size:11px;color:var(--text-3)}
.dp-anchors b{color:var(--text-2);font-weight:500;margin-left:4px}
.chart-card{margin:6px 14px 14px;padding:14px 12px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
.chart-tabs{display:flex;gap:4px;padding:0 4px 8px}
.chart-tabs button{flex:1;height:28px;border-radius:var(--r-s);font-size:11.5px;color:var(--text-3);transition:.15s}
.chart-tabs button.on{background:var(--surface-3);color:var(--text);font-weight:600}
.chart-src{display:flex;justify-content:flex-end;font-size:9.5px;color:var(--text-3);padding:0 6px 6px}
.chart-src b{color:var(--text-2);font-weight:500;margin-left:4px}
/* 搜索浮层：最近浏览 */
.so-history{padding:0 0 4px}
.so-history .sh-title{font-size:11px;color:var(--text-3);padding:12px 16px 4px}
.chart-wrap{position:relative;touch-action:pan-y}
.chart-wrap svg{width:100%;height:auto;display:block}
.x-labels{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-3);padding:6px 2px 0}
.cross{position:absolute;pointer-events:none;display:none}
.cross .cl{position:absolute;top:0;bottom:18px;width:1px;background:var(--line-2)}
.cross .cd{position:absolute;width:7px;height:7px;border-radius:50%;border:2px solid var(--bg);transform:translate(-50%,-50%)}
.cross .ct{position:absolute;transform:translate(-50%,0);background:var(--surface-3);border:1px solid var(--line-2);
  border-radius:7px;padding:4px 9px;font-size:10.5px;white-space:nowrap;box-shadow:var(--shadow)}
.cross .ct b{font-size:11.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 12px}
.stat .k{font-size:10px;color:var(--text-3);margin-bottom:5px}
.stat .v{font-size:14px;font-weight:600}
.dp-actions{display:flex;gap:10px;padding:18px 14px 6px}
.btn{flex:1;height:44px;border-radius:var(--r-m);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#1a1408}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--text-2)}
.src{padding:20px 16px 8px;text-align:center;font-size:9.5px;color:var(--text-3);line-height:1.9}

/* ===== 底部导航 ===== */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  display:flex;background:rgba(13,17,25,.92);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:8px 0 10px;z-index:60}
.bottom-nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-3);font-size:10.5px;transition:.15s}
.bottom-nav .tab svg{width:21px;height:21px}
.bottom-nav .tab.on{color:var(--brand)}

/* ===== 搜索浮层 ===== */
.search-ov{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;max-width:520px;margin:0 auto;flex-direction:column}
.search-ov.open{display:flex;animation:pgIn .22s ease}
.so-bar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.so-input{flex:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-m)}
.so-input input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:16px} /* 16px 防 iOS 缩放 */
.so-input input::placeholder{color:var(--text-3)}
.so-cancel{color:var(--text-2);font-size:13px;padding:8px 4px}
.so-body{flex:1;overflow-y:auto;padding-top:6px}
.so-hint{padding:36px 30px;text-align:center;color:var(--text-3);font-size:12px;line-height:2}
.so-hint b{color:var(--text-2)}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:99;
  background:var(--surface-3);border:1px solid var(--line-2);color:var(--text);
  padding:10px 20px;border-radius:24px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:.25s;box-shadow:var(--shadow);display:flex;align-items:center;gap:7px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--brand)}

/* ===== 桌面端 ≥1024px：双栏终端布局 ===== */
@media (min-width:1024px){
  .app{max-width:none;display:grid;grid-template-columns:440px 1fr;gap:0;height:100vh;padding:0;overflow:hidden}
  .app>.main{height:100vh;overflow-y:auto;border-right:1px solid var(--line);padding-bottom:20px}
  .detail-pane{position:relative;inset:auto;transform:none;max-width:none;margin:0;overflow-y:auto;height:100vh;background:var(--bg)}
  .bottom-nav{display:none}
  .dash{max-width:980px;margin:0 auto}
  .sector-grid{grid-template-columns:repeat(5,1fr)}
  .rank-cols{grid-template-columns:1fr 1fr;max-width:980px;margin:0 auto}
}
</style>
</head>
<body>

<div class="app">
  <div class="main">
    <!-- 顶栏 -->
    <div class="topbar">
      <div class="brand">
        <img src="https://playerhub.df.qq.com/playerhub/60004/object/15080050033.png" alt="" onerror="this.style.display='none'">
        <div><b>落幕查</b><small>MARKET&nbsp;TERMINAL</small></div>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="refreshBtn" title="刷新全部行情（拉取最新 item_price_all）">↻</button>
      <button class="icon-btn" id="schemeBtn" title="切换涨跌配色（红涨绿跌 / 绿涨红跌）"><span class="sw"><i style="background:var(--up)"></i><i style="background:var(--down)"></i></span><span id="schemeLabel">红涨</span></button>
      <button class="icon-btn" id="searchBtn" title="搜索">⌕</button>
    </div>

    <!-- ===== 行情页 ===== -->
    <div class="page on" id="page-market">
      <!-- 市场宽度：上涨/平盘/下跌家数（真实有意义的口径） -->
      <div class="breadth-card">
        <div class="bc-top">
          <span class="bc-title">市场宽度</span>
          <span class="bc-status"><i></i>交易中</span>
        </div>
        <div class="bc-nums">
          <div class="bc-num"><div class="v up" id="nUp">-</div><div class="k">上涨</div></div>
          <div class="bc-num"><div class="v flat" id="nFlat">-</div><div class="k">平盘</div></div>
          <div class="bc-num"><div class="v down" id="nDown">-</div><div class="k">下跌</div></div>
        </div>
        <div class="breadth">
          <div class="b-up" id="bUp"></div>
          <div class="b-flat" id="bFlat"></div>
          <div class="b-down" id="bDown"></div>
        </div>
        <div class="bc-foot">
          <span>情绪：<b id="moodWord">-</b></span>
          <span>近<span id="mhPeriodName">1</span>日 · <span id="mhUpd">--:--</span></span>
        </div>
      </div>

      <!-- 涨幅前二（原版模块回归）：跟随周期，点击进详情 -->
      <div class="topmover" id="topMover"></div>

      <div class="sector-tabs" id="sectorTabs"></div>

      <div class="mkt-tools">
        <div class="seg" id="periodSeg">
          <button data-p="bl" class="on">近1日</button>
          <button data-p="day_3_bl">近3日</button>
          <button data-p="day_7_bl">近7日</button>
        </div>
        <span class="count" id="listCount"></span>
        <div class="spacer"></div>
        <button class="sort-btn" id="sortBtn">排序 <b id="sortLabel">涨跌幅↓</b></button>
        <div class="sort-dd" id="sortDD" style="display:none"></div>
      </div>

      <div class="row-list" id="marketList"></div>
      <div id="listSentinel"></div>
      <div class="list-end" id="listEnd"></div>
    </div>

    <!-- ===== 自选页 ===== -->
    <div class="page" id="page-watch">
      <div class="page-head"><b>我的自选</b><small id="watchCount"></small></div>
      <div class="row-list" id="watchList"></div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav" id="bottomNav">
      <div class="tab on" data-tab="market">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 4 6-8"/><path d="M14 7h4v4"/></svg>
        <span>行情</span>
      </div>
      <div class="tab" data-tab="watch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 9.7l5.4-.8z"/></svg>
        <span>自选</span>
      </div>
    </div>
  </div>

  <!-- ===== 右栏 / 移动浮层：市场总览仪表盘 + 物品详情 ===== -->
  <div class="detail-pane" id="detailPane">
    <!-- 市场总览仪表盘（桌面默认视图；移动端从行情卡右上「总览」进入） -->
    <div id="dashView">
      <div class="dp-nav">
        <button class="back" id="dashBack" style="visibility:hidden">‹</button>
        <div class="ttl">市场总览</div>
        <button class="icon-btn" id="dashRefresh" title="刷新">↻</button>
      </div>
      <div class="dash">
        <div class="bc-nums">
          <div class="bc-num"><div class="v up" id="dUp">-</div><div class="k">上涨</div></div>
          <div class="bc-num"><div class="v flat" id="dFlat">-</div><div class="k">平盘</div></div>
          <div class="bc-num"><div class="v down" id="dDown">-</div><div class="k">下跌</div></div>
        </div>
        <div class="dash-mood" id="dMood"></div>
        <div class="breadth">
          <div class="b-up" id="dUp2"></div><div class="b-flat" id="dFlat2"></div><div class="b-down" id="dDown2"></div>
        </div>
        <div class="dash-sec">板块表现 <small>近<span id="dPeriodName">1</span>日均涨幅 · 点击进入板块</small></div>
        <div class="sector-grid" id="sectorGrid"></div>
        <div class="dash-sec">涨跌幅榜 <small>近<span id="dPeriodName2">1</span>日 · 前5</small></div>
        <div class="rank-cols">
          <div class="rank-card"><div class="rh"><span>涨幅榜</span><span class="up">TOP 5</span></div><div id="rankUp"></div></div>
          <div class="rank-card"><div class="rh"><span>跌幅榜</span><span class="down">TOP 5</span></div><div id="rankDown"></div></div>
        </div>
      </div>
    </div>
    <!-- 物品详情 -->
    <div id="detailBody" style="display:none"></div>
  </div>
</div>

<!-- 搜索浮层 -->
<div class="search-ov" id="searchOv">
  <div class="so-bar">
    <div class="so-input">
      <span style="color:var(--text-3)">⌕</span>
      <input id="soInput" type="text" placeholder="搜索物品名称 / 板块…" autocomplete="off">
    </div>
    <button class="so-cancel" id="soClose">取消</button>
  </div>
  <div class="so-body">
    <div class="so-hint" id="soHint">支持<b>物品名称 / 属性分类 / 板块</b>，多词空格分隔<br>例如：头盔 · 弹匣 · 钥匙 · 收藏品</div>
    <div class="so-history" id="soRecentSec" style="display:none">
      <div class="sh-title">最近浏览</div>
      <div class="row-list" id="soRecent"></div>
    </div>
    <div class="row-list" id="soResults"></div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>

<script src="demo-data.js"></script>
<script>
/* ================= 数据：全量 1359 件（design/gen-demo-data.cjs 生成） ================= */
const CATS = {gun:'枪械',ammo:'子弹',acc:'配件',helmet:'头盔',armor:'护甲',chest:'胸挂',bag:'背包',key:'钥匙卡',collection:'收集品',consume:'消耗品'};
const RAW = (window.__DEMO_ITEMS||[]).map(function(r){
  /* v4：真实行情快照 + 物品属性（长宽重/二级分类，来自 metadata） */
  return { id:r.i, cat:r.c, name:r.n, pic:r.p, grade:r.g, sub:r.s,
    price:r.pr, bl:r.b1, day_3_bl:r.b3, day_7_bl:r.b7,
    day_30_bl:(typeof r.b30==='number'? r.b30 : +(r.b7*1.35).toFixed(2)),
    price_start:r.ps, day_30_price:r.d30, day_3_price:r.d3p||0, day_7_price:r.d7p||0,
    length:r.l||0, width:r.w||0, weight:r.wt||0 };
});

/* ================= 工具 ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const GRADE_COLORS=['','var(--g1)','var(--g2)','var(--g3)','var(--g4)','var(--g5)','var(--g6)'];
const GRADE_NAMES=['','一级','二级','三级','四级','五级','六级'];
function fmtPrice(v){ if(v>=1e8) return (v/1e8).toFixed(2)+'亿'; if(v>=1e4) return +(v/1e4).toFixed(v>=1e6?1:2)+'万'; return Math.round(v).toLocaleString(); }
function fmtChg(v){ const d=Math.abs(v)>=100?1:2; return (v>0?'+':'')+v.toFixed(d)+'%'; }
function arrow(v){ return v>0?'▲':(v<0?'▼':'—'); }
function cls(v){ return v>0.05?'up':(v<-0.05?'down':'flat'); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); document.getElementById('toastText').textContent=msg;
  t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1600); }

/* ================= 状态 ================= */
const S = { sectors:new Set(), period:'bl', sort:'chg-desc', tab:'market',
  favs:new Set(), detail:null, chartPeriod:'day_30', rendered:0, hist:null, recent:[] };
try{ S.recent=JSON.parse(localStorage.getItem('demo_recent_v1')||'[]')||[]; }catch(e){}
const BATCH=60;
const chgFields={'bl':'bl','day_3_bl':'day_3_bl','day_7_bl':'day_7_bl'};
const periodNames={'bl':'1','day_3_bl':'3','day_7_bl':'7'};
const SORTS=[['chg-desc','涨跌幅↓'],['chg-asc','涨跌幅↑'],['price-desc','价格↓'],['price-asc','价格↑'],['default','默认']];

/* ================= 迷你走势线 ================= */
function sparkSVG(it){
  const rnd=mulberry32(((it.id%100000)*3331)+7), n=30, pts=[];
  let v=it.price/(1+Math.max(-99,it.day_7_bl)/100);
  for(let k=0;k<n;k++){ pts.push(v); v=v*(1+(rnd()-0.48)*0.05); }
  pts[n-1]=it.price;
  const min=Math.min(...pts),max=Math.max(...pts),rg=(max-min)||1;
  const d=pts.map((p,k)=>`${(k/(n-1)*56).toFixed(1)},${(24-(p-min)/rg*22+1).toFixed(1)}`).join(' ');
  const color=it.day_7_bl>=0?'var(--up)':'var(--down)';
  return `<svg viewBox="0 0 56 26" preserveAspectRatio="none"><polyline points="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/></svg>`;
}

/* ================= 行渲染 ================= */
function rowHTML(it){
  const g=it.grade, chg=it[chgFields[S.period]];
  return `<div class="row" data-id="${it.id}">
    <div class="pic">${it.pic?`<img src="${it.pic}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph>◆</div>'">`:'<div class="ph">◆</div>'}</div>
    <div class="info">
      <div class="name">${esc(it.name)}</div>
      <div class="tags">
        <span class="tag sector">${CATS[it.cat]||'其他'}</span>
        ${it.sub&&it.sub!==CATS[it.cat]?`<span class="tag sector2">${esc(it.sub)}</span>`:''}
        ${g?`<span class="tag grade" style="color:${GRADE_COLORS[g]}">${GRADE_NAMES[g]}</span>`:''}
      </div>
    </div>
    <div class="spark">${sparkSVG(it)}</div>
    <div class="quote">
      <div class="px num"><small>¥</small>${fmtPrice(it.price)}</div>
      <span class="chg-pill ${cls(chg)}">${arrow(chg)} ${fmtChg(chg)}</span>
    </div>
    <button class="star ${S.favs.has(it.id)?'on':''}" data-star="${it.id}">${S.favs.has(it.id)?'★':'☆'}</button>
  </div>`;
}
function visibleItems(){
  let arr=RAW.filter(i=>S.sectors.size===0||S.sectors.has(i.cat));
  const f=chgFields[S.period];
  if(S.sort==='chg-desc') arr=[...arr].sort((a,b)=>b[f]-a[f]);
  else if(S.sort==='chg-asc') arr=[...arr].sort((a,b)=>a[f]-b[f]);
  else if(S.sort==='price-desc') arr=[...arr].sort((a,b)=>b.price-a.price);
  else if(S.sort==='price-asc') arr=[...arr].sort((a,b)=>a.price-b.price);
  return arr;
}
/* 懒加载：一次 60 行，滚到底自动追加（1359 件全量可浏览） */
let _visCache=[];
function resetList(){ S.rendered=0; _visCache=visibleItems();
  document.getElementById('marketList').innerHTML='';
  document.getElementById('listCount').textContent=`共 ${_visCache.length} 件`;
  appendBatch(); }
function appendBatch(){
  const frag=document.createElement('div');
  const next=_visCache.slice(S.rendered,S.rendered+BATCH);
  frag.innerHTML=next.map(rowHTML).join('');
  const list=document.getElementById('marketList');
  while(frag.firstChild) list.appendChild(frag.firstChild);
  S.rendered+=next.length;
  document.getElementById('listEnd').style.display = S.rendered>=_visCache.length?'block':'none';
}
const sentinel=document.getElementById('listSentinel');
new IntersectionObserver(es=>{ if(es[0].isIntersecting && S.rendered<_visCache.length) appendBatch(); },
  {rootMargin:'400px'}).observe(sentinel);

/* ================= 市场宽度（真实口径：涨跌家数） ================= */
function breadth(arr,f){
  const up=arr.filter(i=>i[f]>0.05).length, down=arr.filter(i=>i[f]<-0.05).length;
  return {up,down,flat:arr.length-up-down,total:arr.length};
}
function moodWord(b){ if(b.total===0)return'-';
  const u=b.up/b.total,d=b.down/b.total;
  if(u-d>0.35)return'普涨'; if(d-u>0.35)return'普跌'; return'震荡'; }
function renderBreadth(){
  const f=chgFields[S.period], b=breadth(RAW,f), T=b.total||1;
  const mood=moodWord(b);
  const set=(ids,val)=>ids.forEach(id=>{const el=document.getElementById(id); if(el)el.textContent=val;});
  set(['nUp','dUp'],b.up); set(['nFlat','dFlat'],b.flat); set(['nDown','dDown'],b.down);
  set(['mhPeriodName','dPeriodName','dPeriodName2'],periodNames[S.period]);
  ['Up','Flat','Down'].forEach(k=>{
    const v=b[k.toLowerCase()]/T*100;
    ['b','d'].forEach(p=>{ const el=document.getElementById(p+k); if(el)el.style.width=v.toFixed(1)+'%'; });
  });
  const moodEl=document.getElementById('moodWord'); if(moodEl)moodEl.textContent=mood;
  const dMood=document.getElementById('dMood');
  if(dMood){ const mv=(b.up-b.down)/(T)*100;
    dMood.innerHTML=`市场情绪 <b class="${cls(mv)}">${mood}</b> · 净上涨 <b class="num ${cls(mv)}">${(mv>0?'+':'')+mv.toFixed(1)}%</b>`; }
  const now=new Date();
  const snap=window.__DEMO_FETCH_AT?new Date(window.__DEMO_FETCH_AT):now;
  set(['mhUpd'],`快照 ${String(snap.getHours()).padStart(2,'0')}:${String(snap.getMinutes()).padStart(2,'0')}`);
  set(['dTotal'],RAW.length);
}

/* ================= 仪表盘：板块表现 + 涨跌幅榜 ================= */
function renderDashboard(){
  const f=chgFields[S.period];
  const grid=document.getElementById('sectorGrid');
  grid.innerHTML=Object.keys(CATS).map(c=>{
    const arr=RAW.filter(i=>i.cat===c); if(!arr.length) return '';
    const b=breadth(arr,f), avg=arr.reduce((s,i)=>s+i[f],0)/arr.length;
    const upRatio=b.up/(b.total||1)*100;
    return `<div class="sec-tile" data-sec="${c}">
      <div class="sn">${CATS[c]}</div>
      <div class="sv num ${cls(avg)}">${arrow(avg)}${fmtChg(avg)}</div>
      <div class="sb"><i style="width:${upRatio.toFixed(0)}%;background:var(--up)"></i><i style="flex:1;background:var(--surface-3)"></i></div>
      <div class="sk"><span>上涨 ${b.up}</span><span>共 ${b.total} 件</span></div>
    </div>`;
  }).join('');
  const f2=chgFields[S.period];
  const upTop=[...RAW].sort((a,b)=>b[f2]-a[f2]).slice(0,5);
  const dnTop=[...RAW].sort((a,b)=>a[f2]-b[f2]).slice(0,5);
  const rankRow=(it,k)=>`<div class="rank-row" data-id="${it.id}">
      <span class="rk">${k+1}</span><span class="rn" title="${esc(it.name)}">${esc(it.name)}</span>
      <span class="rc num ${cls(it[f2])}">${fmtChg(it[f2])}</span></div>`;
  document.getElementById('rankUp').innerHTML=upTop.map(rankRow).join('');
  document.getElementById('rankDown').innerHTML=dnTop.map(rankRow).join('');
}
function showDashboard(){
  document.getElementById('dashView').style.display='block';
  document.getElementById('detailBody').style.display='none';
}
function showDetailPane(){
  document.getElementById('dashView').style.display='none';
  document.getElementById('detailBody').style.display='block';
}

/* ================= 涨幅前二（原版模块回归；降噪：仅计价格 ≥ 2万 的标的） ================= */
const TOP_MOVER_MIN_PRICE = 20000;
function renderTopMovers(){
  const f=chgFields[S.period];
  const top=[...RAW].filter(i=>i.price>=TOP_MOVER_MIN_PRICE).sort((a,b)=>b[f]-a[f]).slice(0,2);
  document.getElementById('topMover').innerHTML=`
    <div class="tm-head">
      <span class="tt"><span class="fire">🔥</span>涨幅前二</span>
      <span class="tp">全市场 ≥2万 · 近${periodNames[S.period]}日</span>
      <span class="more" id="tmMore">完整榜单 ›</span>
    </div>
    ${top.map((it,k)=>`
    <div class="tm-row" data-id="${it.id}">
      <span class="tm-rank">${k+1}</span>
      <span class="tm-pic">${it.pic?`<img src="${it.pic}" alt="" loading="lazy" onerror="this.outerHTML='<div style=font-size:14px;opacity:.4>◆</div>'">`:'<div style="font-size:14px;opacity:.4">◆</div>'}</span>
      <span class="tm-name">${esc(it.name)}<small>${CATS[it.cat]||'其他'}${it.grade?' · '+GRADE_NAMES[it.grade]:''}</small></span>
      <span class="tm-px num"><small>¥</small>${fmtPrice(it.price)}</span>
      <span class="tm-chg num ${cls(it[f])}">${arrow(it[f])} ${fmtChg(it[f])}</span>
    </div>`).join('')}`;
  document.getElementById('tmMore').onclick=e=>{
    e.stopPropagation();
    showDashboard();
    const pane=document.getElementById('detailPane');
    pane.classList.add('open'); pane.scrollTop=0;
  };
}

/* ================= 板块 tabs（多选，原版分类能力回归） ================= */
function renderSectorTabs(){
  const el=document.getElementById('sectorTabs');
  const counts={}; RAW.forEach(i=>counts[i.cat]=(counts[i.cat]||0)+1);
  const allOn=S.sectors.size===0;
  el.innerHTML=`<button class="sector-tab ${allOn?'on':''}" data-sec="all" title="清空分类筛选">全部 ${RAW.length}</button>`+
    Object.keys(CATS).filter(c=>counts[c]).map(c=>
      `<button class="sector-tab ${S.sectors.has(c)?'on':''}" data-sec="${c}" title="可多选">${S.sectors.has(c)?'✓ ':''}${CATS[c]} ${counts[c]}</button>`).join('');
}

/* ================= 详情 + 图表 ================= */
const byId={}; RAW.forEach(i=>byId[i.id]=i);
/* ================= 走势数据源：真实优先，绝不插值编造 =================
   ① 近30/7/3日 → Cloudflare D1 每日采集的真实数据点（/api/history/:id）
   ② 近1日 → D1 无日内点，只用「今开 price_start → 现价 price」两个真实锚点
   ③ D1 无记录/请求失败 → 退回 item_price_all 的真实锚点连线（30/7/3天前、今开、现价） */
function sliceAnchor(it,period){
  const full={pts:[it.day_30_price,it.day_7_price,it.day_3_price,it.price_start,it.price],
              labels:['30天前','7天前','3天前','今开','现价']};
  const start={'bl':3,'day_3_bl':2,'day_7_bl':1,'day_30':0}[period]||0;
  return { pts:full.pts.slice(start), labels:full.labels.slice(start),
           src: start>=3 ? '今日锚点' : '真实锚点连线' };
}
function d1Series(snaps,period){
  const days={'day_3_bl':3,'day_7_bl':7,'day_30':30}[period];
  if(!days) return null;
  const cut=snaps.slice(-days);
  if(cut.length<2) return null;
  return { pts:cut.map(s=>s.p), labels:cut.map(s=>String(s.d).slice(5).replace('-','/')), src:'D1 每日记录' };
}
function buildSeries(it){
  if(S.chartPeriod==='bl') return sliceAnchor(it,'bl'); /* 近1日只有今开→现价 */
  if(S.hist){ const s=d1Series(S.hist,S.chartPeriod); if(s) return s; }
  return sliceAnchor(it,S.chartPeriod);
}
function loadHistory(it){
  if(S._histFor===it.id && S.hist) return; /* 已为该标的缓存过 D1 历史 */
  fetch('/api/history/'+it.id).then(r=>r.json()).then(j=>{
    if(!j || j.code!==0 || !j.data || !Array.isArray(j.data.snapshots)) return;
    const snaps=j.data.snapshots.slice().reverse(); /* 接口为新→旧，转旧→新 */
    if(snaps.length<2) return;
    const fresh=S._histFor!==it.id;
    S.hist=snaps; S._histFor=it.id;
    /* D1 到达后整页重渲染：头部涨跌幅、曲线颜色、徽标三者口径一致 */
    if(fresh && S.detail && S.detail.id===it.id && S.chartPeriod!=='bl') renderDetail(it);
  }).catch(()=>{});
}
function srcBadge(ser){
  const n=ser.pts.length;
  if(ser.src==='今日锚点') return '数据：<b>今开 → 现价（真实锚点，无日内记录）</b>';
  if(ser.src==='D1 每日记录') return `数据：<b>Cloudflare D1 每日采集 · ${n} 个真实数据点</b>`;
  return `数据：<b>真实锚点连线（D1 暂无记录）· ${n} 点</b>`;
}
function updateChartMeta(){
  const ser=S._series; if(!ser) return;
  const badge=document.getElementById('chartSrcBadge'); if(badge) badge.innerHTML=srcBadge(ser);
  const xl=document.querySelector('.x-labels');
  if(xl){ const L=ser.labels, mid=L.length<=2?'':L[Math.floor((L.length-1)/2)];
    xl.innerHTML=`<span>${L[0]}</span><span>${mid}</span><span>${L[L.length-1]}</span>`; }
}
function redrawChart(it){
  const wrap=document.querySelector('.chart-wrap'); if(!wrap) return;
  wrap.innerHTML=renderChart(it)+'<div class="cross"><div class="cl"></div><div class="cd"></div><div class="ct"></div></div>';
  updateChartMeta(); bindCrosshair();
}

function renderChart(it){
  const ser=S._series||buildSeries(it);
  const pts=ser.pts;
  const W=640,H=250,P=14,PR=76; /* P 左留白，PR 右侧价格刻度区 */
  const min=Math.min(...pts),max=Math.max(...pts),rg=(max-min)||1;
  const X=k=>P+k/(pts.length-1)*(W-P-PR);
  const Y=v=>P+(1-(v-min)/rg)*(H-2*P-14);
  const color=pts[pts.length-1]>=pts[0]?'var(--up)':'var(--down)';
  let d='M'; pts.forEach((p,k)=>{ d+=`${X(k).toFixed(1)} ${Y(p).toFixed(1)}`+(k<pts.length-1?' L':''); });
  const area=d+` L${X(pts.length-1).toFixed(1)} ${H-P} L${X(0).toFixed(1)} ${H-P} Z`;
  /* 价格刻度：4 档（max / ⅔ / ⅓ / min），行情软件右侧口径 */
  const ticks=[max,max-rg/3,max-2*rg/3,min];
  const gid='g'+((it.id%100000)+pts.length);
  renderChart._cache={pts,X,Y,min,max,W,H,P,PR,labels:ser.labels,it};
  return `<svg id="chartSvg" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${ticks.map(t=>`
      <line x1="${P}" x2="${W-PR+4}" y1="${Y(t)}" y2="${Y(t)}" stroke="rgba(255,255,255,.06)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <text x="${W-PR+10}" y="${Y(t)+3.5}" font-size="11" fill="#5d6678" style="font-variant-numeric:tabular-nums">¥${fmtPrice(t)}</text>`).join('')}
    <path d="${area}" fill="url(#${gid})"/>
    <path id="chartLine" d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${pts.map((p,k)=>`<circle cx="${X(k).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="${pts.length<=7?3:2}" fill="${color}" stroke="var(--bg)" stroke-width="1.5"/>`).join('')}
    <text x="${X(pts.length-1)-8}" y="${Y(pts[pts.length-1])-10 < P+10 ? Y(pts[pts.length-1])+18 : Y(pts[pts.length-1])-10}" font-size="11.5" font-weight="700" fill="${color}" text-anchor="end" style="font-variant-numeric:tabular-nums">¥${fmtPrice(pts[pts.length-1])}</text>
  </svg>`;
}
function bindCrosshair(){
  const wrap=document.querySelector('.chart-wrap'); if(!wrap) return;
  const svg=wrap.querySelector('svg'), cross=wrap.querySelector('.cross'); if(!svg) return;
  const c=renderChart._cache;
  const move=e=>{
    const r=svg.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const k=Math.max(0,Math.min(c.pts.length-1,Math.round(x/r.width*(c.pts.length-1))));
    const v=c.pts[k];
    cross.style.display='block';
    const px=c.X(k)/c.W*r.width;
    const py=c.Y(v)/c.H*r.height;
    cross.querySelector('.cl').style.left=px+'px';
    const dot=cross.querySelector('.cd'); dot.style.left=px+'px'; dot.style.top=py+'px';
    dot.style.background=v>=c.pts[0]?'var(--up)':'var(--down)';
    const tip=cross.querySelector('.ct');
    tip.style.left=Math.max(60,Math.min(r.width-60,px))+'px'; tip.style.top='4px';
    const chg=(v/c.pts[0]-1)*100;
    tip.innerHTML=`${c.labels?c.labels[k]:''}<br><b class="num ${cls(chg)}">¥${fmtPrice(v)}</b>`;
  };
  wrap.onpointermove=move;
  wrap.onpointerleave=()=>cross.style.display='none';
}
function renderDetail(it){
  if(!S.detail || S.detail.id!==it.id){ S.hist=null; S._histFor=null; }
  S.detail=it;
  /* 涨跌幅直接取自本图数据序列（首→尾）：与折线颜色严格同向，红涨绿跌绝不打架 */
  const ser=S._series=buildSeries(it);
  const p0=ser.pts[0], p1=ser.pts[ser.pts.length-1];
  const chg=(p0>0&&p1>0)?(p1/p0-1)*100:it[{'bl':'bl','day_3_bl':'day_3_bl','day_7_bl':'day_7_bl','day_30':'day_30_bl'}[S.chartPeriod]];
  const open=it.price_start, d30=it.day_30_price;
  const lo=Math.min(open,d30,it.price), hi=Math.max(open,d30,it.price);
  const pos=Math.max(0,Math.min(100,((it.price-lo)/((hi-lo)||1))*100)).toFixed(0);
  const rising=chg>=0;
  document.getElementById('detailBody').innerHTML=`
    <div class="dp-nav">
      <button class="back" id="dpBack">‹ 返回</button>
      <div class="ttl">${esc(it.name)}</div>
      <button class="icon-btn ${S.favs.has(it.id)?'on':''}" id="dpFav" style="color:${S.favs.has(it.id)?'var(--brand)':''}">${S.favs.has(it.id)?'★':'☆'}</button>
    </div>
    <div class="dp-hero">
      <div class="head">
        <div class="pic">${it.pic?`<img src="${it.pic}" alt="" onerror="this.outerHTML='<div style=font-size:24px;opacity:.4>◆</div>'">`:'<div style="font-size:24px;opacity:.4">◆</div>'}</div>
        <div style="min-width:0">
          <h1>${esc(it.name)}</h1>
          <div class="tags">
            <span class="tag sector">${CATS[it.cat]||'其他'}${it.sub&&it.sub!==CATS[it.cat]?' · '+esc(it.sub):''}</span>
            ${it.grade?`<span class="tag grade" style="color:${GRADE_COLORS[it.grade]}">${GRADE_NAMES[it.grade]}</span>`:''}
          </div>
        </div>
      </div>
      <div class="dp-price">
        <span class="big num ${rising?'up':'down'}"><small>¥</small>${fmtPrice(it.price)}</span>
        <span class="chg num ${cls(chg)}">${arrow(chg)} ${fmtChg(chg)}</span>
      </div>
      <div class="dp-anchors">
        <span>今开<b class="num">¥${fmtPrice(open)}</b></span>
        <span>30日前<b class="num">¥${fmtPrice(d30)}</b></span>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-tabs" id="chartTabs">
        <button data-cp="bl">近1日</button>
        <button data-cp="day_3_bl">近3日</button>
        <button data-cp="day_7_bl">近7日</button>
        <button data-cp="day_30" class="on">近30日</button>
      </div>
      <div class="chart-src" id="chartSrcBadge"></div>
      <div class="chart-wrap">${renderChart(it)}
        <div class="cross"><div class="cl"></div><div class="cd"></div><div class="ct"></div></div>
      </div>
      <div class="x-labels"></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">今日开盘</div><div class="v num">¥${fmtPrice(open)}</div></div>
      <div class="stat"><div class="k">30日前</div><div class="v num">¥${fmtPrice(d30)}</div></div>
      <div class="stat"><div class="k">30日区间</div><div class="v num" style="font-size:12px">¥${fmtPrice(lo)} ~ ${fmtPrice(hi)}</div></div>
      <div class="stat"><div class="k">当前分位</div><div class="v num">${pos}%</div></div>
      <div class="stat"><div class="k">等级</div><div class="v" style="color:${GRADE_COLORS[it.grade]||'var(--text-3)'}">${GRADE_NAMES[it.grade]||'—'}</div></div>
      <div class="stat"><div class="k">板块</div><div class="v" style="font-size:12.5px">${CATS[it.cat]||'其他'}</div></div>
      ${it.sub&&it.sub!==CATS[it.cat]?`<div class="stat"><div class="k">属性分类</div><div class="v" style="font-size:12.5px">${esc(it.sub)}</div></div>`:''}
      ${it.length||it.width?`<div class="stat"><div class="k">尺寸(格)</div><div class="v num">${it.length||'–'} × ${it.width||'–'}</div></div>`:''}
      ${it.weight?`<div class="stat"><div class="k">重量</div><div class="v num">${it.weight}</div></div>`:''}
    </div>
    <div class="dp-actions">
      <button class="btn ghost" id="dpRefresh">↻ 刷新</button>
      <button class="btn primary" id="dpFav2">${S.favs.has(it.id)?'★ 已自选':'☆ 加入自选'}</button>
    </div>`;
  showDetailPane();
  const pane=document.getElementById('detailPane'); pane.classList.add('open'); pane.scrollTop=0;
  updateChartMeta();
  loadHistory(it);   /* 异步取 D1 真实日点，到达后自动重绘 */
  pushRecent(it.id); /* 最近浏览（原版功能回归） */
  bindCrosshair();
  document.getElementById('dpBack').onclick=()=>{ closeDetail(); };
  document.getElementById('dpFav').onclick=()=>toggleFav(it.id);
  document.getElementById('dpFav2').onclick=()=>toggleFav(it.id);
  document.getElementById('dpRefresh').onclick=()=>refreshAll();
  document.querySelectorAll('#chartTabs button').forEach(b=>b.onclick=()=>{
    S.chartPeriod=b.dataset.cp;
    document.querySelectorAll('#chartTabs button').forEach(x=>x.classList.toggle('on',x===b));
    renderDetail(it);
  });
}
function closeDetail(){
  document.getElementById('detailPane').classList.remove('open');
  showDashboard(); /* 桌面：回到仪表盘；移动：浮层滑走 */
}

/* ================= 自选 ================= */
function toggleFav(id){
  const it=byId[id]; if(!it) return;
  if(S.favs.has(id)){ S.favs.delete(id); toast(`已移出自选 · ${it.name}`); }
  else { S.favs.add(id); toast(`已加入自选 · ${it.name}`); }
  renderWatch();
  document.querySelectorAll(`[data-star="${id}"]`).forEach(b=>{
    b.classList.toggle('on',S.favs.has(id)); b.textContent=S.favs.has(id)?'★':'☆'; });
  if(S.detail) renderDetail(S.detail);
}
function renderWatch(){
  const arr=RAW.filter(i=>S.favs.has(i.id));
  document.getElementById('watchCount').textContent=arr.length?`${arr.length} 个标的`:'';
  document.getElementById('watchList').innerHTML=arr.length?arr.map(rowHTML).join('')
    :'<div class="so-hint">暂无自选标的<br>点击列表行右侧 ☆ 加入自选</div>';
}

/* ================= 搜索 ================= */
/* ================= 搜索（字符级包含 + 多词 AND；空态显示最近浏览） ================= */
function openSearch(){ document.getElementById('searchOv').classList.add('open');
  const inp=document.getElementById('soInput'); inp.value=''; soFilter('');
  setTimeout(()=>inp.focus(),80); }
function closeSearch(){ document.getElementById('searchOv').classList.remove('open'); }
function soFilter(q){
  q=q.trim().toLowerCase();
  const hint=document.getElementById('soHint'), res=document.getElementById('soResults'), rec=document.getElementById('soRecentSec');
  if(!q){
    hint.style.display='block'; res.innerHTML='';
    renderRecent();
    if(rec) rec.style.display='block';
    return;
  }
  hint.style.display='none'; if(rec) rec.style.display='none';
  const ks=q.split(/\s+/).filter(Boolean); /* 多关键词 AND，覆盖名称/属性分类/板块 */
  const hit=RAW.filter(i=>{
    const hay=(i.name+' '+(CATS[i.cat]||'')+' '+(i.sub||'')).toLowerCase();
    return ks.every(k=>hay.includes(k));
  }).slice(0,50);
  res.innerHTML=hit.length?hit.map(rowHTML).join(''):`<div class="so-hint">未找到 “${esc(q)}” 相关标的</div>`;
}
/* 最近浏览（原版功能回归，localStorage 持久化） */
function pushRecent(id){
  S.recent=[id].concat(S.recent.filter(x=>x!==id)).slice(0,10);
  try{localStorage.setItem('demo_recent_v1',JSON.stringify(S.recent));}catch(e){}
}
function renderRecent(){
  const sec=document.getElementById('soRecentSec'), el=document.getElementById('soRecent');
  if(!sec||!el) return;
  const arr=S.recent.map(id=>byId[id]).filter(Boolean);
  if(arr.length){ sec.style.display='block'; el.innerHTML=arr.map(rowHTML).join(''); }
  else sec.style.display='none';
}

/* ================= 真实刷新：拉最新 item_price_all，全站更新 ================= */
let _refreshing=false;
function refreshAll(){
  if(_refreshing) return Promise.resolve(false);
  _refreshing=true;
  const btns=[...document.querySelectorAll('#refreshBtn,#dashRefresh')];
  btns.forEach(b=>b&&b.classList.add('spin'));
  return fetch('/api/refresh').then(r=>r.json()).then(j=>{
    if(!j || j.code!==0 || !Array.isArray(j.data)) throw new Error('响应异常');
    const map={}; j.data.forEach(x=>{ map[x.id]=x; });
    /* 更新现有标的（价格/涨跌幅/今开/30日前全部真实字段） */
    RAW.forEach(it=>{
      const u=map[it.id]; if(!u) return;
      it.price=u.price||it.price; it.bl=u.bl||0; it.day_3_bl=u.day_3_bl||0; it.day_7_bl=u.day_7_bl||0;
      it.day_30_bl=u.day_30_bl||0; it.price_start=u.price_start||it.price;
      it.day_30_price=u.day_30_price||0; it.day_3_price=u.day_3_price||0; it.day_7_price=u.day_7_price||0;
      delete map[it.id];
    });
    /* 上游新增标的（无元数据时占位名，与正式版降级口径一致） */
    Object.keys(map).forEach(id=>{
      const u=map[id];
      const nu={id:Number(id),cat:'unknown',name:'物品#'+id,pic:'',grade:0,sub:'',
        price:u.price||0,bl:u.bl||0,day_3_bl:u.day_3_bl||0,day_7_bl:u.day_7_bl||0,day_30_bl:u.day_30_bl||0,
        price_start:u.price_start||u.price||0,day_30_price:u.day_30_price||0,
        day_3_price:u.day_3_price||0,day_7_price:u.day_7_price||0,length:0,width:0,weight:0};
      RAW.push(nu); byId[nu.id]=nu;
    });
    window.__DEMO_FETCH_AT=new Date().toISOString();
    renderAll();
    if(S.detail){ const cur=byId[S.detail.id]; if(cur) renderDetail(cur); }
    const n=new Date();
    toast(`行情已刷新 · ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}（${j.data.length} 件）`);
    return true;
  }).catch(()=>{
    toast('刷新失败：请通过本地服务访问（127.0.0.1:8931）');
    return false;
  }).finally(()=>{
    _refreshing=false;
    btns.forEach(b=>b&&b.classList.remove('spin'));
  });
}

/* ================= 总渲染 ================= */
function renderAll(){
  renderSectorTabs();
  resetList();
  renderWatch();
  renderBreadth();
  renderDashboard();
  renderTopMovers();
}

/* ================= 事件绑定 ================= */
document.getElementById('sectorTabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-sec]'); if(!b) return;
  const sec=b.dataset.sec;
  if(sec==='all') S.sectors.clear();
  else { S.sectors.has(sec)?S.sectors.delete(sec):S.sectors.add(sec); } /* 分类多选：再点一次取消 */
  renderSectorTabs(); resetList();
});
document.getElementById('sectorGrid').addEventListener('click',e=>{
  const t=e.target.closest('[data-sec]'); if(!t) return;
  S.sectors=new Set([t.dataset.sec]);
  renderSectorTabs(); resetList();
  document.querySelector('.app>.main').scrollTo({top:0});
  toast(`已进入板块 · ${CATS[t.dataset.sec]}`);
});
document.getElementById('periodSeg').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]'); if(!b) return;
  S.period=b.dataset.p;
  document.querySelectorAll('#periodSeg button').forEach(x=>x.classList.toggle('on',x===b));
  resetList(); renderBreadth(); renderDashboard(); renderTopMovers();
});
document.getElementById('sortBtn').onclick=e=>{
  e.stopPropagation();
  const dd=document.getElementById('sortDD');
  const willShow=dd.style.display==='none';
  dd.innerHTML=SORTS.map(s=>
    `<button data-sort="${s[0]}" class="${S.sort===s[0]?'on':''}"><span class="sdot"></span>${s[1]}</button>`).join('');
  dd.style.display=willShow?'block':'none';
};
document.getElementById('sortDD').addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('[data-sort]'); if(!b) return;
  S.sort=b.dataset.sort;
  document.getElementById('sortLabel').textContent=SORTS.find(s=>s[0]===S.sort)[1];
  document.getElementById('sortDD').style.display='none';
  resetList();
});
document.getElementById('bottomNav').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  S.tab=t.dataset.tab;
  document.querySelectorAll('#bottomNav .tab').forEach(x=>x.classList.toggle('on',x===t));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='page-'+S.tab));
});
document.body.addEventListener('click',e=>{
  const dd=document.getElementById('sortDD');
  if(dd && dd.style.display!=='none' && !e.target.closest('.mkt-tools')) dd.style.display='none';
  const star=e.target.closest('[data-star]');
  if(star){ e.stopPropagation(); toggleFav(+star.dataset.star); return; }
  const row=e.target.closest('.row,.rank-row,.tm-row');
  if(row && row.dataset.id!==undefined){ renderDetail(byId[+row.dataset.id]); }
});
document.getElementById('searchBtn').onclick=openSearch;
document.getElementById('soClose').onclick=closeSearch;
document.getElementById('soInput').addEventListener('input',e=>soFilter(e.target.value));
document.getElementById('dashRefresh').onclick=()=>refreshAll();
document.getElementById('refreshBtn').onclick=()=>refreshAll();
document.getElementById('schemeBtn').onclick=()=>{
  const html=document.documentElement;
  const to=html.dataset.scheme==='cn'?'intl':'cn';
  html.dataset.scheme=to;
  document.getElementById('schemeLabel').textContent=to==='cn'?'红涨':'绿涨';
  toast(to==='cn'?'已切换：红涨绿跌（中国惯例）':'已切换：绿涨红跌（国际惯例）');
};
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSearch(); closeDetail(); } });

/* ================= 启动 ================= */
renderAll();
</script>
