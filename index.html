列表页(分类/排序/分页) | 详情页(价格图表/收藏) | 搜索页(实时搜索/历史/最近浏览/收藏) | 底部Tab导航

<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta http-equiv="Pragma" content="no-cache">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="三角洲价格查询">
  <!-- ★ 预连接上游 API 域名，减少 TLS 握手延迟 -->
  <link rel="preconnect" href="https://orzice.com" crossorigin>
  <link rel="dns-prefetch" href="https://orzice.com">
  <link rel="preload" href="/delta-force-logo.webp" as="image" fetchpriority="high">
  <script>
    // ★ 同源：使用部署站点自带的 /api 代理（Cloudflare Pages Functions）
    window.__WORKER_BASE = '';
  </script>
  <script>
    // ★ 预取 v3：metadata.json（静态元数据）+ item_price_all（实时价格）→ 客户端合并
    // 2 请求替代 143 请求，~2s 拿到全量 1350 件，排序/筛选纯本地
    window.__prefetch = (function() {
      var CATS = ['gun','ammo','acc','helmet','armor','chest','bag','key','collection','consume'];
      var proxyUrl = window.__WORKER_BASE + '/api/proxy';
      var running = {};

      var _allMerged = [];
      var _allResolve, _allReject;
      var _allReady = new Promise(function(res, rej) { _allResolve = res; _allReject = rej; });
      var _dataReady = false;
      var _totalArrived = 0;
      var _onArriveCallbacks = [];

      // 物品显著性评分：|涨跌幅| × 价格档位
      function _significanceScore(item) {
        var bl = Math.abs(item.bl || item.day_3_bl || item.day_7_bl || 0);
        var price = item.price || 0;
        if (price <= 0) return bl;
        var priceFactor = price >= 1000000 ? 4 : price >= 100000 ? 3 : price >= 10000 ? 2 : 1;
        return bl * priceFactor;
      }

      function _notifyArrive(items) {
        _totalArrived += items.length;
        running._totalArrived = _totalArrived;
        for (var i = 0; i < _onArriveCallbacks.length; i++) {
          try { _onArriveCallbacks[i](items, _totalArrived); } catch(e) {}
        }
      }

      // 初始化分类对象（保持与 v2 兼容）
      CATS.forEach(function(cat) {
        var quickResolve, quickReject;
        var obj = {
          _resolvedData: [],
          _totalCount: 0,
          _complete: false,
          _loadingMore: true,
          _hasPage1: false,
          _onComplete: null,
          _quick: new Promise(function(res, rej) { quickResolve = res; quickReject = rej; })
        };
        obj._qr = quickResolve;
        obj._qj = quickReject;
        running[cat] = obj;
      });

      // ★ 检查 localStorage 是否有缓存（用于加速加载动画）
      var _hasCache = false;
      try {
        var _raw = localStorage.getItem('deltaforce_cache_v10');
        if (_raw) {
          var _parsed = JSON.parse(_raw);
          if (_parsed && _parsed._allItems && _parsed._allItems.length > 50) _hasCache = true;
        }
      } catch(e) {}

      // ★ 涨幅前二数据（item_price_all 返回后填充）
      var _topMoverData = null;
      var _topMoverApiDone = false;
      running._topMoverData = null;
      running._topMoverApiDone = false;

      // ★ 核心：并行拉取价格 + 元数据，客户端合并
      // metadata 优先从 /api/metadata（KV动态更新）获取，失败降级到静态文件
      var metadataPromise = fetch('/api/metadata')
        .then(function(r) { return r.json(); })
        .catch(function() {
          console.warn('[prefetch] /api/metadata 不可用，降级到静态文件');
          return fetch('/data/metadata.json')
            .then(function(r) { return r.json(); })
            .catch(function() {
              console.error('[prefetch] 静态 metadata 也失败，物品将显示为"物品#ID"');
              running._metadataFailed = true;
              return {};
            });
        });

      // ★ 带超时 + 1次重试的 fetch
      function _fetchWithTimeout(url, timeoutMs) {
        return new Promise(function(resolve, reject) {
          var controller = new AbortController();
          var timer = setTimeout(function() { controller.abort(); }, timeoutMs);
          fetch(url, { signal: controller.signal })
            .then(function(r) { clearTimeout(timer); resolve(r); })
            .catch(function(e) { clearTimeout(timer); reject(e); });
        });
      }

      function _fetchPriceAllWithRetry() {
        var url = proxyUrl + '?endpoint=item_price_all';
        return _fetchWithTimeout(url, 15000).catch(function(err) {
          console.warn('[prefetch] item_price_all 首次失败(' + err.message + ')，1秒后重试...');
          return new Promise(function(resolve) {
            setTimeout(function() { resolve(_fetchWithTimeout(url, 15000)); }, 1000);
          });
        }).catch(function(err) {
          console.warn('[prefetch] item_price_all 重试也失败(' + err.message + ')');
          return new Promise(function(resolve) {
            setTimeout(function() { resolve(_fetchWithTimeout(url, 20000)); }, 1500);
          });
        });
      }

      // ★ 错误状态（loading 层可检查）
      running._error = null;
      running._metadataFailed = false;  // metadata 加载失败标志
      running.getError = function() { return running._error; };
      running.isMetadataDegraded = function() { return running._metadataFailed; };

      // ★ 暴露重试入口
      running.retry = function() { location.reload(); };

      Promise.all([
        _fetchPriceAllWithRetry().then(function(r) { return r.json(); }),
        metadataPromise
      ]).then(async function(results) {
        var priceRes = results[0];
        var metadata = results[1];

        if (!priceRes || priceRes.code !== 0 || !Array.isArray(priceRes.data)) {
          console.error('[prefetch] item_price_all 返回异常');
          _allReject(new Error('price data unavailable'));
          return;
        }

        // ★ 合并：item_price_all 提供价格，metadata 提供名称/图标/分类
        var merged = priceRes.data.map(function(item) {
          var meta = metadata[item.id] || metadata[item.tid] || {};
          var result = Object.assign({}, item, meta);
          if (!result._category) {
            // 尝试用 tid 在 metadata 中查找
            var metaByTid = metadata[item.tid];
            if (metaByTid) {
              result = Object.assign({}, item, metaByTid);
            } else {
              result._category = 'unknown';
              result.name = result.name || ('物品#' + item.id);
            }
          }
          return result;
        });

        // ★ 补充 metadata 中有但 item_price_all 中没有的物品（已下架/过期物品）
        var priceIds = {};
        merged.forEach(function(item) { priceIds[item.id] = true; if (item.tid) priceIds[item.tid] = true; });
        Object.keys(metadata).forEach(function(id) {
          if (!priceIds[Number(id)] && !priceIds[id]) {
            var meta = metadata[id];
            merged.push(Object.assign(
              { id: Number(id), price: 0, bl: 0, day_3_bl: 0, day_7_bl: 0, tid: meta.tid },
              meta
            ));
          }
        });

        // ★ 元数据自动补全：检测合并后仍有未知分类/无名物品，从 item_list API 补全
        var _unknownItems = merged.filter(function(item) {
          return !item._category || item._category === 'unknown' || !item.name || item.name.indexOf('物品#') === 0;
        });

        if (_unknownItems.length > 0) {
          console.warn('[prefetch] 发现 ' + _unknownItems.length + ' 个未知物品，启动补全...');

          // Phase 1: 用已获取的 metadata 按 tid 二次匹配
          if (Object.keys(metadata).length > 0) {
            _unknownItems.forEach(function(item) {
              if (item.tid && metadata[item.tid]) {
                Object.assign(item, metadata[item.tid]);
              }
            });
            _unknownItems = merged.filter(function(item) {
              return !item._category || item._category === 'unknown' || !item.name || item.name.indexOf('物品#') === 0;
            });
          }

          // Phase 2: 从 item_list 第1页并行拉取 10 个分类补全
          if (_unknownItems.length > 0) {
            var _unknownIds = {};
            _unknownItems.forEach(function(item) { _unknownIds[item.id] = true; if (item.tid) _unknownIds[item.tid] = true; });

            var _itemListPromises = CATS.map(function(cat) {
              return fetch(proxyUrl + '?endpoint=item_list&types=' + cat + '&p=1')
                .then(function(r) { return r.json(); })
                .catch(function() { return null; });
            });

            try {
              var _itemListResults = await Promise.all(_itemListPromises);
              var _patched = 0;

              for (var ci = 0; ci < CATS.length; ci++) {
                var cat = CATS[ci];
                var result = _itemListResults[ci];
                if (!result || result.code !== 0 || !Array.isArray(result.data)) continue;
                for (var ii = 0; ii < result.data.length; ii++) {
                  var apiItem = result.data[ii];
                  var apiId = apiItem.id;
                  if (!apiId) continue;
                  if (_unknownIds[apiId] || (apiItem.tid && _unknownIds[apiItem.tid])) {
                    for (var mi = 0; mi < _unknownItems.length; mi++) {
                      var uItem = _unknownItems[mi];
                      if (uItem.id === apiId || (apiItem.tid && uItem.tid === apiItem.tid) || uItem.id === apiItem.tid) {
                        uItem._category = cat;
                        uItem.name = apiItem.name || uItem.name;
                        uItem.pic = apiItem.pic || uItem.pic || '';
                        if (apiItem.grade !== undefined && apiItem.grade !== null) uItem.grade = apiItem.grade;
                        if (apiItem.objectID !== undefined && apiItem.objectID !== null) uItem.objectID = apiItem.objectID;
                        if (apiItem.tid !== undefined && apiItem.tid !== null) uItem.tid = apiItem.tid;
                        if (apiItem.secondClassCN) uItem.secondClassCN = apiItem.secondClassCN;
                        if (apiItem.ShopSellType) uItem.ShopSellType = apiItem.ShopSellType;
                        _patched++;
                      }
                    }
                  }
                }
              }

              if (_patched > 0) {
                console.log('[prefetch] 补全完成: ' + _patched + ' 个物品获得元数据');
              } else {
                console.warn('[prefetch] item_list page1 未找到剩余未知物品的元数据');
              }
            } catch(e) {
              console.warn('[prefetch] item_list 补全失败:', e.message);
            }
          }
        }

        _allMerged = merged;

        // ★ 按分类分配
        var catMap = {};
        CATS.forEach(function(c) { catMap[c] = []; });
        merged.forEach(function(item) {
          var cat = item._category;
          if (cat && catMap[cat]) {
            catMap[cat].push(item);
          }
        });

        // 填充各分类对象
        CATS.forEach(function(cat) {
          var items = catMap[cat];
          items.sort(function(a, b) { return _significanceScore(b) - _significanceScore(a); });
          var o = running[cat];
          o._resolvedData = items;
          o._totalCount = items.length;
          o._complete = true;
          o._hasPage1 = true;
          o._loadingMore = false;
          var page1Result = { code: 0, count: items.length, data: items, _complete: true };
          o._qr(page1Result);
          if (typeof o._onComplete === 'function') o._onComplete(items);
        });

        // ★ 涨幅前二数据就绪
        _topMoverData = priceRes.data;
        _topMoverApiDone = true;
        running._topMoverData = _topMoverData;
        running._topMoverApiDone = true;

        _dataReady = true;
        _notifyArrive(merged);
        _allResolve(merged.slice().sort(function(a, b) { return _significanceScore(b) - _significanceScore(a); }));

        // 写入缓存
        if (typeof setCache === 'function') {
          try { setCache({ _allItems: merged }); } catch(e) {}
        }
        if (typeof buildSearchIndex === 'function') {
          try { buildSearchIndex(merged); } catch(e) {}
        }
        if (typeof updateCategoryIcons === 'function') {
          try { updateCategoryIcons(merged); } catch(e) {}
        }
      }).catch(function(err) {
        console.error('[prefetch] 加载失败:', err);
        running._error = err.message || '数据加载失败，请检查网络连接';
        _allReject(err);
        // ★ 3 秒后仍未恢复 → 显示重试按钮（loading 层的 8s 超时可能已隐藏 loading）
        var errWrap = document.getElementById('loadingRetryWrap');
        var errText = document.getElementById('loadingErrorText');
        var statusEl = document.getElementById('loadingStatus');
        if (errWrap) errWrap.style.display = 'flex';
        if (errText) errText.textContent = running._error;
        if (statusEl) statusEl.textContent = '连接超时';
      });

      // ★ 暴露 API（保持与 v2 兼容）
      running._allPage1Ready = _allReady;
      running._totalArrived = 0;
      running.getTotalArrived = function() { return _totalArrived; };
      running.onItemsArrive = function(cb) { _onArriveCallbacks.push(cb); };
      running.getAllPage1Items = function() { return _allMerged.slice(); };
      running.isAllPage1Ready = function() { return _dataReady; };
      running.startPagination = function() {}; // no-op: 数据一次到齐
      running.getQueueLength = function() { return 0; };
      running.isPaginationDone = function() { return _dataReady; };
      running.hasCache = _hasCache;
      running.getProgress = function() {
        return _dataReady ? 0.98 : 0.05;
      };
      running.getExpectedTotal = function() { return _dataReady ? _totalArrived : 1350; };
      // ★ 新增：分类全量检查
      running.isCategoryComplete = function(cat) { return _dataReady; };
      running.getCategoryLoadedCount = function(cat) {
        var o = running[cat];
        return o && o._resolvedData ? o._resolvedData.length : 0;
      };
      running.prioritizeCategory = function(cat) {}; // no-op: 数据一次到齐

      return running;
    })();
  </script>

          <button class="filter-cat-chip" data-cat="chest" onclick="event.stopPropagation();setHomeCategory('chest')">胸挂</button>
          <button class="filter-cat-chip" data-cat="bag" onclick="event.stopPropagation();setHomeCategory('bag')">背包</button>
          <button class="filter-cat-chip" data-cat="key" onclick="event.stopPropagation();setHomeCategory('key')">钥匙卡</button>
          <button class="filter-cat-chip" data-cat="collection" onclick="event.stopPropagation();setHomeCategory('collection')">收集品</button>
          <button class="filter-cat-chip" data-cat="consume" onclick="event.stopPropagation();setHomeCategory('consume')">消耗品</button>
        </div>
      </div>

      <!-- ★ 排序下拉 -->
      <div class="dropdown-panel" id="sortDropdown" style="display:none" onclick="event.stopPropagation()">
        <button class="dropdown-item active" type="button" data-sort="default" data-dir="" onclick="event.stopPropagation();setHomeSort('default','desc')">默认 (综合热度)</button>
        <button class="dropdown-item" type="button" data-sort="change" data-dir="desc" onclick="event.stopPropagation();setHomeSort('change','desc')">涨跌幅 ↓ (高到低)</button>
        <button class="dropdown-item" type="button" data-sort="change" data-dir="asc" onclick="event.stopPropagation();setHomeSort('change','asc')">涨跌幅 ↑ (低到高)</button>
        <button class="dropdown-item" type="button" data-sort="price" data-dir="desc" onclick="event.stopPropagation();setHomeSort('price','desc')">价格 ↓ (高到低)</button>
        <button class="dropdown-item" type="button" data-sort="price" data-dir="asc" onclick="event.stopPropagation();setHomeSort('price','asc')">价格 ↑ (低到高)</button>
      </div>

      <div class="search-bar" onclick="showSearch()">
        <span class="search-placeholder">搜索物品名称...</span>
      </div>
      <div class="top-mover-card" id="topMover" style="display:none"></div>
      <div class="price-alert" id="priceAlert"></div>
      <div class="price-changed-section" id="priceChangedSection">
        <div class="price-changed-title">收藏价格提醒</div>
        <div id="priceChangedItems"></div>
      </div>

      <!-- ★ 首页物品列表 -->
      <div class="home-movers-section" id="homeMoversSection">
        <div id="homeMoversList"></div>
      </div>
    </div>

    <!-- ===== 列表页 ===== -->
    <div class="page" id="page-list">
      <div class="nav-bar">
        <div class="nav-back" onclick="goBack()">‹ 返回</div>
        <div class="nav-title" id="listTitle">物品列表</div>
        <div class="nav-actions">
          <span class="nav-action" onclick="refreshCurrentList()" title="刷新当前分类">刷新</span>
          <span class="nav-action" onclick="showSearch()" title="搜索">搜索</span>
        </div>
      </div>
      <div class="list-stats" id="listStats"></div>
      <div class="sort-bar" id="sortBar">
        <button class="sort-btn active" data-sort="price" onclick="setSort('price')">价格</button>
        <button class="sort-btn" data-sort="change" onclick="setSort('change')">涨跌幅</button>
      </div>
      <div id="listContent"></div>
      <div id="pagination"></div>
    </div>

    <!-- ===== 详情页 ===== -->
    <div class="page" id="page-detail">
      <div class="nav-bar">
        <div class="nav-back" onclick="goBack()">‹ 返回</div>
        <div class="nav-title">物品详情</div>
        <div class="nav-actions">
          <span class="nav-action" id="detailFavBtn" onclick="toggleCurrentFavorite()" title="收藏"></span>
          <span class="nav-action" onclick="refreshCurrentItem()" title="刷新此物品">刷新</span>
        </div>
      </div>
      <div id="detailContent">
        <div class="loading-container"><div class="loading-spinner"></div><div class="loading-text">正在向API请求最新数据...</div></div>
      </div>
    </div>

    <!-- ===== 搜索页 ===== -->
    <div class="page slide-in" id="page-search">
      <div class="search-header">
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="输入物品名称搜索..." autocomplete="off">
          <span class="search-clear" id="searchClear" onclick="clearSearch()">✕</span>
        </div>
        <div class="search-cancel" onclick="hideSearch()">取消</div>
      </div>
      <div class="search-hint" id="searchHint">
        <div class="hint-title">搜索提示</div>
        <div class="hint-text">支持搜索物品名称关键词<br>例如：头盔、弹匣、钥匙、瞄具...</div>
      </div>
      <!-- 搜索历史 -->
      <div class="history-section" id="searchHistory" style="display:none">
        <div class="history-title">
          <span>搜索历史</span>
          <span class="history-clear" onclick="clearSearchHistory()">清空</span>
        </div>
        <div class="history-tags" id="historyTags"></div>
      </div>
      <!-- 最近浏览 -->
      <div class="history-section" id="recentViewSection" style="display:none">
        <div class="history-title">
          <span>最近浏览</span>
          <span class="history-clear" onclick="clearRecentViews()">清空</span>
        </div>
        <div class="recent-items" id="recentViewItems"></div>
      </div>
      <!-- 收藏物品 -->
      <div class="history-section" id="favoritesSection" style="display:none">
        <div class="history-title">
          <span>我的收藏</span>
          <span class="history-clear" onclick="clearFavorites()">清空</span>
        </div>
        <div class="recent-items" id="favoritesItems"></div>
      </div>
      <div id="searchResults"></div>
    </div>


    <!-- ===== 我的收藏页 ===== -->
    <div class="page" id="page-favtab">
      <div class="nav-bar">
        <div class="nav-back" onclick="switchTab('home')">‹ 首页</div>
        <div class="nav-title">我的收藏</div>
        <div class="nav-actions">
          <span class="nav-action" onclick="refreshFavTab()" title="刷新">刷新</span>
        </div>
      </div>
      <div id="favtabContent"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <!-- ===== 底部导航 ===== -->
  <div class="bottom-nav" id="bottomNav">
    <div class="tab active" data-tab="home" onclick="switchTab('home')">
      <span class="tab-label">首页</span>
    </div>
    <div class="tab" data-tab="favtab" onclick="switchTab('favtab')">
      <span class="tab-label">我的收藏</span>
    </div>
  </div>

  <!-- Service Worker 注册（必须在 bundle 之前加载） -->
  <script src="js/sw-register.js?v=v20260803n" defer></script>
  <!-- ★ 单文件 bundle：减少 HTTP 请求 6→1，defer 不阻塞解析 -->
  <script src="js/bundle.js?v=v20260803n" defer></script>
</body>
</html>
