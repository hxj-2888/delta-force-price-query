<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>三角洲行动 - 变卖物价格查询</title>
  <link rel="icon" type="image/png" href="/delta-force-logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="三角洲价格查询">
  <link rel="preload" href="/delta-force-logo.png" as="image" fetchpriority="high">
  <script>
    // ★ 同源：使用部署站点自带的 /api 代理（Cloudflare Pages Functions）
    // 不再依赖外部 Worker 域，统一部署链路
    window.__WORKER_BASE = '';
  </script>
  <script>
    // ★ 渐进式预取 — 首页立即 resolve（仅第一页），剩余分页后台静默加载
    window.__prefetch = (function() {
      var CATS = ['gun','ammo','acc','helmet','armor','chest','bag','key','collection','consume'];
      var limit = 5000;
      var proxyUrl = window.__WORKER_BASE + '/api/proxy';
      var running = {};

      function fetchPage(cat, page, signal) {
        return fetch(proxyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endpoint: 'item_list', params: { types: cat, p: page, limit: limit } }),
          signal: signal
        }).then(function(r) { return r.json(); })
          .then(function(r) { return { data: (r && r.data) ? r.data : [], count: (r && r.count) ? r.count : 0 }; })
          .catch(function() { return { data: [], count: 0 }; });
      }

      /** 后台拉取剩余分页，完成后更新 _resolvedData 为全量 */
      async function fetchRemainingPages(cat, page1Items, totalCount, perPage) {
        var all = page1Items.slice();
        var totalPages = totalCount > 0 ? Math.ceil(totalCount / perPage) : 1;
        if (totalPages <= 1 && page1Items.length >= limit) { totalPages = 2; }
        if (totalPages <= 1) { return all; }
        try {
          var nextP = 2;
          var maxPages = 200;
          while (nextP <= totalPages && nextP <= maxPages) {
            var batchFns = [];
            var batchEnd = Math.min(nextP + 7, totalPages, maxPages);
            for (var p = nextP; p <= batchEnd; p++) {
              batchFns.push((function(page) {
                var ac = new AbortController();
                var tid = setTimeout(function() { ac.abort(); }, 15000);
                return fetchPage(cat, page, ac.signal).then(function(r) { clearTimeout(tid); return r; });
              })(p));
            }
            var results = await Promise.all(batchFns);
            var gotData = false;
            results.forEach(function(result) {
              if (result.data && result.data.length > 0) {
                all = all.concat(result.data);
                gotData = true;
              }
            });
            nextP = batchEnd + 1;
            if (!gotData) break;
            if (nextP > totalPages && gotData && nextP <= maxPages) {
              totalPages = Math.min(nextP + 1, maxPages);
            }
          }
        } catch(e) { /* 后台失败不影响首页数据 */ }
        var items = all.map(function(item) { item._category = cat; return item; });
        // 更新为完整数据
        running[cat]._resolvedData = items;
        running[cat]._complete = true;
        running[cat]._loadingMore = false;
        if (typeof running[cat]._onComplete === 'function') {
          running[cat]._onComplete(items);
        }
        return items;
      }

      CATS.forEach(function(cat) {
        // _quick: 仅等待首页数据的快速 promise，UI 可用它立即渲染
        var quickResolve, quickReject;
        running[cat]._quick = new Promise(function(res, rej) { quickResolve = res; quickReject = rej; });

        running[cat] = (async function() {
          try {
            var res1 = await fetchPage(cat, 1);
            if (!res1 || !res1.data || res1.data.length === 0) {
              quickResolve({ code: 0, count: 0, data: [], _complete: true });
              return null;
            }
            var page1Items = res1.data.slice().map(function(item) { item._category = cat; return item; });
            var totalCount = res1.count || 0;
            var perPage = res1.data.length > 0 ? res1.data.length : limit;

            // ★ 立即暴露首页数据 + 真实总数，UI 马上可用
            running[cat]._resolvedData = page1Items;
            running[cat]._totalCount = totalCount;
            running[cat]._totalPages = Math.max(1, Math.ceil(totalCount / perPage));
            running[cat]._hasPage1 = true;
            running[cat]._complete = (page1Items.length >= totalCount);
            running[cat]._loadingMore = !running[cat]._complete;

            // ★ 用首页数据立即 resolve _quick
            quickResolve({ code: 0, count: totalCount, data: page1Items, _complete: running[cat]._complete });

            // 后台继续拉取剩余分页
            if (!running[cat]._complete) {
              var allItems = await fetchRemainingPages(cat, page1Items, totalCount, perPage);
              return { code: 0, count: allItems.length, data: allItems, _complete: true };
            }
            return { code: 0, count: totalCount, data: page1Items, _complete: true };
          } catch(e) {
            quickReject(e);
            return null;
          }
        })();
      });
      return running;
    })();
  </script>
  <link rel="stylesheet" href="css/base.css?v=20260727">
  <link rel="stylesheet" href="css/layout.css?v=20260727">
  <link rel="stylesheet" href="css/components.css?v=20260727">
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
  <div class="loading-logo-wrap">
    <div class="loading-logo-glow" id="loadingGlow"></div>
    <img class="loading-logo-img" id="loadingLogo" src="delta-force-logo.png" alt="三角洲行动">
  </div>
  <div class="loading-progress-wrap">
    <div class="loading-progress-track">
      <div class="loading-progress-bar" id="loadingProgressBar"></div>
    </div>
    <div class="loading-status" id="loadingStatus">正在连接数据源...</div>
  </div>
</div>
<div class="container" id="app">
    <!-- ===== 首页 ===== -->
    <div class="page active" id="page-home">
      <div class="header">
        <img class="header-logo" src="delta-force-logo.png" alt="三角洲行动" onerror="this.style.display='none'">
        <div class="header-title">三角洲行动</div>
        <div class="header-subtitle">变卖物实时价格查询</div>
        <div class="header-info">
          <span class="refresh-all" onclick="refreshAllData()">刷新全部</span>
          <span id="autoRefreshTime" style="font-size:10px;color:#555;margin-left:8px"></span>
        </div>
      </div>
      <div class="search-bar" onclick="showSearch()">
        <span class="search-placeholder">搜索物品名称...</span>
      </div>
      <div class="top-mover-card" id="topMover" style="display:none"></div>
      <div class="price-alert" id="priceAlert"></div>
      <div class="price-changed-section" id="priceChangedSection">
        <div class="price-changed-title">收藏价格提醒</div>
        <div id="priceChangedItems"></div>
      </div>
      <div class="category-grid" id="categoryGrid"></div>
    </div>

    <!-- ===== 列表页 ===== -->
    <div class="page" id="page-list">
      <div class="nav-bar">
        <div class="nav-back" onclick="goBack()">‹ 返回</div>
        <div class="nav-title" id="listTitle">物品列表</div>
        <div class="nav-actions">
          <span class="nav-action" onclick="refreshCurrentList()" title="刷新当前分类">刷新</span>
          <span class="nav-action" onclick="showSearch()" title="搜索">搜索</span>
        </div>
      </div>
      <div class="list-stats" id="listStats"></div>
      <div class="sort-bar" id="sortBar">
        <button class="sort-btn active" data-sort="price" onclick="setSort('price')">价格<span class="sort-dir" id="dir-price">↓</span></button>
        <button class="sort-btn" data-sort="change" onclick="setSort('change')">涨跌幅<span class="sort-dir" id="dir-change"></span></button>
      </div>
      <div id="listContent"></div>
      <div id="pagination"></div>
    </div>

    <!-- ===== 详情页 ===== -->
    <div class="page" id="page-detail">
      <div class="nav-bar">
        <div class="nav-back" onclick="goBack()">‹ 返回</div>
        <div class="nav-title">物品详情</div>
        <div class="nav-actions">
          <span class="nav-action" id="detailFavBtn" onclick="toggleCurrentFavorite()" title="收藏"></span>
          <span class="nav-action" onclick="refreshCurrentItem()" title="刷新此物品">刷新</span>
        </div>
      </div>
      <div id="detailContent">
        <div class="loading-container"><div class="loading-spinner"></div><div class="loading-text">正在向API请求最新数据...</div></div>
      </div>
    </div>

    <!-- ===== 搜索页 ===== -->
    <div class="page slide-in" id="page-search">
      <div class="search-header">
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="输入物品名称搜索..." autocomplete="off">
          <span class="search-clear" id="searchClear" onclick="clearSearch()">✕</span>
        </div>
        <div class="search-cancel" onclick="hideSearch()">取消</div>
      </div>
      <div class="search-hint" id="searchHint">
        <div class="hint-title">搜索提示</div>
        <div class="hint-text">支持搜索物品名称关键词<br>例如：头盔、弹匣、钥匙、瞄具...</div>
      </div>
      <!-- 搜索历史 -->
      <div class="history-section" id="searchHistory" style="display:none">
        <div class="history-title">
          <span>搜索历史</span>
          <span class="history-clear" onclick="clearSearchHistory()">清空</span>
        </div>
        <div class="history-tags" id="historyTags"></div>
      </div>
      <!-- 最近浏览 -->
      <div class="history-section" id="recentViewSection" style="display:none">
        <div class="history-title">
          <span>最近浏览</span>
          <span class="history-clear" onclick="clearRecentViews()">清空</span>
        </div>
        <div class="recent-items" id="recentViewItems"></div>
      </div>
      <!-- 收藏物品 -->
      <div class="history-section" id="favoritesSection" style="display:none">
        <div class="history-title">
          <span>我的收藏</span>
          <span class="history-clear" onclick="clearFavorites()">清空</span>
        </div>
        <div class="recent-items" id="favoritesItems"></div>
      </div>
      <div id="searchResults"></div>
    </div>

    <!-- ===== 价格异动页 ===== -->
    <div class="page" id="page-price">
      <div class="nav-bar">
        <div class="nav-back" onclick="switchTab('home')">‹ 首页</div>
        <div class="nav-title">价格异动</div>
        <div class="nav-actions" style="width:auto;gap:6px">
          <button class="sort-btn" id="btnGainers" style="font-size:11px;padding:5px 10px;border-radius:14px" onclick="setPriceDirection('up')">涨幅榜</button>
          <button class="sort-btn" id="btnLosers" style="font-size:11px;padding:5px 10px;border-radius:14px" onclick="setPriceDirection('down')">跌幅榜</button>
          <span class="nav-action" onclick="refreshPriceMovers()" title="刷新">刷新</span>
        </div>
      </div>
      <div id="priceContent"></div>
    </div>

    <!-- ===== 我的收藏页 ===== -->
    <div class="page" id="page-favtab">
      <div class="nav-bar">
        <div class="nav-back" onclick="switchTab('home')">‹ 首页</div>
        <div class="nav-title">我的收藏</div>
        <div class="nav-actions">
          <span class="nav-action" onclick="refreshFavTab()" title="刷新">刷新</span>
        </div>
      </div>
      <div id="favtabContent"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <!-- ===== 底部导航 ===== -->
  <div class="bottom-nav" id="bottomNav">
    <div class="tab active" data-tab="home" onclick="switchTab('home')">
      <span class="tab-label">首页</span>
    </div>
    <div class="tab" data-tab="price" onclick="switchTab('price')">
      <span class="tab-label">价格异动</span>
    </div>
    <div class="tab" data-tab="favtab" onclick="switchTab('favtab')">
      <span class="tab-label">我的收藏</span>
    </div>
  </div>

  <!-- 模块加载顺序：依赖方在后 -->
  <script src="js/utils.js?v=20260728"></script>
  <script src="js/store.js?v=20260728"></script>
  <script src="js/render.js?v=20260728"></script>
  <script src="js/api.js?v=20260728"></script>
  <script src="js/sw-register.js?v=20260728"></script>
  <script src="js/main.js?v=20260728"></script>
</body>
</html>
